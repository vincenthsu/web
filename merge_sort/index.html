<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort 演算法視覺化</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- 引入 Babel (用於解析 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自定義捲軸樣式 (讓代碼區塊更好看) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        // --- 1. 圖標組件 (替代 lucide-react，使用內嵌 SVG) ---
        const Play = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const Pause = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        );
        const SkipForward = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        );
        const SkipBack = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        );
        const RotateCcw = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        );
        const Shuffle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        );
        const ChevronRight = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>
        );

        // --- 2. 核心邏輯 ---
        const { useState, useEffect } = React;

        const CPP_CODE = `void merge(int arr[], int l, int m, int r) {
    int n1 = m - l + 1;
    int n2 = r - m;
    int L[n1], R[n2];

    // 複製數據到臨時陣列
    for (int i = 0; i < n1; i++) L[i] = arr[l + i];
    for (int j = 0; j < n2; j++) R[j] = arr[m + 1 + j];

    int i = 0, j = 0, k = l;
    while (i < n1 && j < n2) {
        // 比較 L[i] 和 R[j]
        if (L[i] <= R[j]) {
            arr[k] = L[i]; i++;
        } else {
            arr[k] = R[j]; j++;
        }
        k++;
    }
    // 複製剩餘元素
    while (i < n1) { arr[k] = L[i]; i++; k++; }
    while (j < n2) { arr[k] = R[j]; j++; k++; }
}`;

        const STEP_TYPE = {
            DEFAULT: 'default',
            SPLIT: 'split',
            COMPARE: 'compare',
            OVERWRITE: 'overwrite',
            SORTED: 'sorted'
        };

        const generateMergeSortSteps = (initialArray) => {
            const steps = [];
            const array = [...initialArray];

            steps.push({
                array: [...array],
                highlight: [],
                range: { start: 0, end: array.length - 1 },
                type: STEP_TYPE.DEFAULT,
                message: "演算法開始，準備進行合併排序。",
                codeLines: []
            });

            const merge = (arr, l, m, r) => {
                const n1 = m - l + 1;
                const n2 = r - m;

                const L = arr.slice(l, m + 1);
                const R = arr.slice(m + 1, r + 1);

                steps.push({
                    array: [...arr],
                    highlight: [],
                    range: { start: l, end: r },
                    type: STEP_TYPE.SPLIT,
                    message: `正在合併區間 [${l}, ${m}] 和 [${m+1}, ${r}]`,
                    codeLines: [0, 1, 2, 4, 5, 6, 7]
                });

                let i = 0;
                let j = 0;
                let k = l;

                while (i < n1 && j < n2) {
                    steps.push({
                        array: [...arr],
                        highlight: [k],
                        range: { start: l, end: r },
                        type: STEP_TYPE.COMPARE,
                        message: `比較左側值 ${L[i]} 與 右側值 ${R[j]}`,
                        codeLines: [11, 12, 13]
                    });

                    if (L[i] <= R[j]) {
                        arr[k] = L[i];
                        steps.push({
                            array: [...arr],
                            highlight: [k],
                            range: { start: l, end: r },
                            type: STEP_TYPE.OVERWRITE,
                            message: `將較小值 ${L[i]} 放入索引 ${k}`,
                            codeLines: [14]
                        });
                        i++;
                    } else {
                        arr[k] = R[j];
                        steps.push({
                            array: [...arr],
                            highlight: [k],
                            range: { start: l, end: r },
                            type: STEP_TYPE.OVERWRITE,
                            message: `將較小值 ${R[j]} 放入索引 ${k}`,
                            codeLines: [16]
                        });
                        j++;
                    }
                    k++;
                }

                while (i < n1) {
                    steps.push({
                        array: [...arr],
                        highlight: [k],
                        range: { start: l, end: r },
                        type: STEP_TYPE.OVERWRITE,
                        message: `左側剩餘值 ${L[i]} 放入索引 ${k}`,
                        codeLines: [21]
                    });
                    arr[k] = L[i];
                    i++;
                    k++;
                }

                while (j < n2) {
                    steps.push({
                        array: [...arr],
                        highlight: [k],
                        range: { start: l, end: r },
                        type: STEP_TYPE.OVERWRITE,
                        message: `右側剩餘值 ${R[j]} 放入索引 ${k}`,
                        codeLines: [22]
                    });
                    arr[k] = R[j];
                    j++;
                    k++;
                }
            };

            const mergeSort = (arr, l, r) => {
                if (l >= r) return;
                const m = l + parseInt((r - l) / 2);
                mergeSort(arr, l, m);
                mergeSort(arr, m + 1, r);
                merge(arr, l, m, r);
            };

            mergeSort(array, 0, array.length - 1);

            steps.push({
                array: [...array],
                highlight: [],
                range: { start: 0, end: array.length - 1 },
                type: STEP_TYPE.SORTED,
                message: "排序完成！",
                codeLines: []
            });

            return steps;
        };

        // --- 3. React 組件 ---
        function MergeSortVisualizer() {
            const [inputStr, setInputStr] = useState("12, 11, 13, 5, 6, 7");
            const [array, setArray] = useState([12, 11, 13, 5, 6, 7]);
            const [steps, setSteps] = useState([]);
            const [currentStep, setCurrentStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(500);

            useEffect(() => {
                const initialSteps = generateMergeSortSteps(array);
                setSteps(initialSteps);
                setCurrentStep(0);
                setIsPlaying(false);
            }, [array]);

            useEffect(() => {
                let timer;
                if (isPlaying && currentStep < steps.length - 1) {
                timer = setTimeout(() => {
                    setCurrentStep((prev) => prev + 1);
                }, speed);
                } else if (currentStep >= steps.length - 1) {
                setIsPlaying(false);
                }
                return () => clearTimeout(timer);
            }, [isPlaying, currentStep, steps.length, speed]);

            const handleInputChange = (e) => {
                setInputStr(e.target.value);
            };

            const applyInput = () => {
                try {
                    const newArr = inputStr.split(',')
                        .map(str => parseInt(str.trim()))
                        .filter(n => !isNaN(n));

                    if (newArr.length > 0) {
                        setArray(newArr);
                    } else {
                        alert("請輸入有效的數字格式");
                    }
                } catch (e) {
                    alert("輸入格式錯誤");
                }
            };

            const generateRandom = () => {
                const len = Math.floor(Math.random() * 8) + 5;
                const newArr = Array.from({ length: len }, () => Math.floor(Math.random() * 50) + 1);
                setArray(newArr);
                setInputStr(newArr.join(', '));
            };

            const currentStepData = steps[currentStep] || {
                array: array,
                highlight: [],
                range: {start: -1, end: -1},
                type: 'default',
                message: '',
                codeLines: []
            };

            const getBarColor = (index, stepData) => {
                if (stepData.type === STEP_TYPE.SORTED) return 'bg-green-500';

                if (stepData.highlight.includes(index)) {
                    if (stepData.type === STEP_TYPE.OVERWRITE) return 'bg-red-500';
                    if (stepData.type === STEP_TYPE.COMPARE) return 'bg-yellow-400';
                }

                if (index >= stepData.range.start && index <= stepData.range.end) {
                    return 'bg-purple-300';
                }

                return 'bg-slate-300';
            };

            const codeLines = CPP_CODE.split('\n');

            return (
                <div className="min-h-screen p-4">
                <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

                    {/* 左側/上方：視覺化與控制區 */}
                    <div className="lg:col-span-2 flex flex-col gap-4">

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h1 className="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span className="p-2 bg-blue-600 text-white rounded-lg text-sm">Merge Sort</span>
                        演算法視覺化
                        </h1>

                        <div className="flex flex-col sm:flex-row gap-3 items-center">
                        <input
                            type="text"
                            value={inputStr}
                            onChange={handleInputChange}
                            className="flex-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-full"
                            placeholder="輸入數字，用逗號分隔 (例如: 5, 2, 9, 1)"
                        />
                        <button onClick={applyInput} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors whitespace-nowrap">
                            應用輸入
                        </button>
                        <button onClick={generateRandom} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors whitespace-nowrap">
                            <Shuffle size={16} /> 隨機生成
                        </button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex-1 min-h-[400px] flex flex-col">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-lg font-semibold text-gray-700">視覺化演示</h2>
                            <div className="flex gap-4 text-sm text-gray-500">
                                <div className="flex items-center gap-1"><span className="w-3 h-3 bg-purple-300 rounded-sm"></span> 處理範圍</div>
                                <div className="flex items-center gap-1"><span className="w-3 h-3 bg-yellow-400 rounded-sm"></span> 比較中</div>
                                <div className="flex items-center gap-1"><span className="w-3 h-3 bg-red-500 rounded-sm"></span> 覆寫/移動</div>
                                <div className="flex items-center gap-1"><span className="w-3 h-3 bg-green-500 rounded-sm"></span> 完成</div>
                            </div>
                        </div>

                        <div className="flex-1 flex items-end justify-center gap-2 sm:gap-4 p-4 border-b border-gray-100 overflow-x-auto">
                            {currentStepData.array.map((val, idx) => {
                                const isMax = Math.max(...currentStepData.array);
                                const heightPercent = Math.max((val / (isMax || 1)) * 100, 10);

                                return (
                                    <div key={idx} className="flex flex-col items-center gap-2 group relative transition-all duration-300 w-12 sm:w-16">
                                        <span className="font-bold text-gray-700 mb-1">{val}</span>
                                        <div
                                            className={`w-full rounded-t-md transition-colors duration-200 ${getBarColor(idx, currentStepData)}`}
                                            style={{ height: `${heightPercent * 2.5}px` }}
                                        ></div>
                                        <span className="text-xs text-gray-400 mt-2 font-mono">{idx}</span>
                                        {currentStepData.highlight.includes(idx) && (
                                            <div className="absolute -bottom-8 text-blue-600 animate-bounce">
                                                ▲
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200 text-center">
                            <p className="text-lg font-medium text-gray-800">
                                {currentStepData.message || "準備開始..."}
                            </p>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { setIsPlaying(false); setCurrentStep(0); }}
                                className="p-2 hover:bg-gray-100 rounded-full text-gray-600"
                                title="重置"
                            >
                                <RotateCcw size={20} />
                            </button>
                            <button
                                onClick={() => { setIsPlaying(false); setCurrentStep(Math.max(0, currentStep - 1)); }}
                                disabled={currentStep === 0}
                                className="p-2 hover:bg-gray-100 rounded-full text-gray-600 disabled:opacity-30"
                                title="上一步"
                            >
                                <SkipBack size={20} />
                            </button>

                            <button
                                onClick={() => setIsPlaying(!isPlaying)}
                                className={`flex items-center gap-2 px-6 py-2 rounded-full font-medium transition-colors ${
                                    isPlaying ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-green-100 text-green-600 hover:bg-green-200'
                                }`}
                            >
                                {isPlaying ? <><Pause size={18} /> 暫停</> : <><Play size={18} /> 播放</>}
                            </button>

                            <button
                                onClick={() => { setIsPlaying(false); setCurrentStep(Math.min(steps.length - 1, currentStep + 1)); }}
                                disabled={currentStep === steps.length - 1}
                                className="p-2 hover:bg-gray-100 rounded-full text-gray-600 disabled:opacity-30"
                                title="下一步"
                            >
                                <SkipForward size={20} />
                            </button>
                        </div>

                        <div className="flex items-center gap-6 flex-1 justify-end min-w-[200px]">
                            <div className="text-sm text-gray-500 font-mono">
                                Step: <span className="font-bold text-gray-800">{currentStep + 1}</span> / {steps.length}
                            </div>

                            <div className="flex items-center gap-2">
                                <span className="text-xs text-gray-400">速度</span>
                                <input
                                    type="range"
                                    min="50"
                                    max="1000"
                                    step="50"
                                    value={1050 - speed}
                                    onChange={(e) => setSpeed(1050 - parseInt(e.target.value))}
                                    className="w-24 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                />
                            </div>
                        </div>
                    </div>

                    </div>

                    {/* 右側：程式碼邏輯區 */}
                    <div className="flex flex-col bg-slate-900 rounded-xl overflow-hidden shadow-lg h-full max-h-[800px]">
                        <div className="bg-slate-800 p-3 px-4 flex items-center justify-between border-b border-slate-700">
                            <span className="text-slate-200 font-mono text-sm font-semibold">merge_sort.cpp</span>
                            <div className="flex gap-1.5">
                                <div className="w-3 h-3 rounded-full bg-red-500"></div>
                                <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                                <div className="w-3 h-3 rounded-full bg-green-500"></div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 font-mono text-sm relative">
                            <pre className="text-slate-300">
                                <code>
                                    {codeLines.map((line, idx) => {
                                        const isHighlighted = currentStepData.codeLines?.includes(idx);

                                        return (
                                            <div
                                                key={idx}
                                                className={`relative pl-4 transition-colors duration-200 ${
                                                    isHighlighted
                                                        ? 'bg-slate-700 text-yellow-300 border-l-4 border-yellow-400 -ml-4 pl-4'
                                                        : 'opacity-70'
                                                }`}
                                            >
                                                <span className="inline-block w-6 text-slate-600 select-none mr-2 text-right">{idx + 1}</span>
                                                {line}

                                                {isHighlighted && idx === currentStepData.codeLines[0] && (
                                                    <span className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-yellow-400/80 hidden sm:inline-block">
                                                        <ChevronRight size={14} />
                                                    </span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </code>
                            </pre>
                        </div>

                        <div className="bg-slate-800 p-4 border-t border-slate-700">
                            <h3 className="text-yellow-400 text-sm font-bold mb-1">邏輯解析</h3>
                            <p className="text-slate-300 text-sm leading-relaxed">
                                {currentStepData.type === STEP_TYPE.SPLIT && "遞迴地將陣列切分為左右兩個子區間。"}
                                {currentStepData.type === STEP_TYPE.COMPARE && "比較左右兩個子區間的當前元素，決定誰先進入排序陣列。"}
                                {currentStepData.type === STEP_TYPE.OVERWRITE && "將較小的元素覆寫回原陣列的對應位置 (k)。"}
                                {currentStepData.type === STEP_TYPE.SORTED && "所有遞迴呼叫結束，陣列已完全排序。"}
                                {currentStepData.type === STEP_TYPE.DEFAULT && "等待開始..."}
                            </p>
                        </div>
                    </div>

                </div>
                </div>
            );
        }

        // --- 4. 渲染 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MergeSortVisualizer />);
    </script>
</body>
</html>
