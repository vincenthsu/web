<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日溫度演算法視覺化 (Daily Temperatures Visualization)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons (Inline SVGs to replace lucide-react dependency) ---
        const Play = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const Pause = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        );
        const SkipForward = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        );
        const SkipBack = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        );
        const RotateCcw = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        );
        const ChevronRight = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><polyline points="9 18 15 12 9 6"></polyline></svg>
        );
        const Info = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        );

        // --- C++ 程式碼字串 ---
        const CPP_CODE = `vector<int> dailyTemperatures(vector<int>& T) {
    int n = T.size();
    vector<int> answer(n, 0);
    stack<int> st; // stores indices

    for (int i = 0; i < n; ++i) {
        while (!st.empty() && T[i] > T[st.top()]) {
            int prevIndex = st.top();
            st.pop();
            answer[prevIndex] = i - prevIndex;
        }
        st.push(i);
    }
    return answer;
}`;

        // --- 預設範例 ---
        const EXAMPLES = [
            { label: '範例 1', data: [73, 74, 75, 71, 69, 72, 76, 73] },
            { label: '範例 2', data: [30, 40, 50, 60] },
            { label: '範例 3', data: [30, 60, 90] },
            { label: '波動測試', data: [89, 62, 70, 58, 47, 47, 46, 76, 100, 70] },
        ];

        const DailyTemperaturesViz = () => {
            // --- State ---
            const [inputStr, setInputStr] = useState(EXAMPLES[0].data.join(','));
            const [temperatures, setTemperatures] = useState(EXAMPLES[0].data);
            const [steps, setSteps] = useState([]);
            const [currentStepIndex, setCurrentStepIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(1000);
            const [errorMsg, setErrorMsg] = useState('');

            // 使用 useRef 來存儲 interval ID (瀏覽器中為 number)
            const timerRef = useRef(null);

            // --- 演算法邏輯產生器 ---
            const generateSteps = useCallback((temps) => {
                const stepsList = [];
                const n = temps.length;
                const answer = new Array(n).fill(0);
                const stack = []; // 存儲索引
                const resolvedIndices = [];

                // Helper to add step
                const addStep = (
                    type,
                    desc,
                    line,
                    currIdx,
                    compIdx,
                    currStack,
                    currAns,
                    resolved
                ) => {
                    stepsList.push({
                        temperatures: temps,
                        stack: [...currStack],
                        answer: [...currAns],
                        currentIndex: currIdx,
                        comparingIndex: compIdx,
                        description: desc,
                        highlightLine: line,
                        resolvedIndices: [...resolved]
                    });
                };

                // 1. 初始化
                addStep('INIT', '初始化變數：陣列長度 n, answer 陣列全填 0, 空的 Stack。', 3, -1, null, stack, answer, resolvedIndices);

                for (let i = 0; i < n; i++) {
                    // 2. 進入迴圈
                    addStep('LOOP_START', `進入迴圈，目前處理第 ${i} 天 (溫度 ${temps[i]})。`, 6, i, null, stack, answer, resolvedIndices);

                    // 3. While 迴圈檢查
                    while (true) {
                        if (stack.length === 0) {
                            addStep('COMPARE_FAIL', `Stack 是空的，無需比較。`, 7, i, null, stack, answer, resolvedIndices);
                            break;
                        }

                        const topIndex = stack[stack.length - 1];
                        addStep('COMPARE_START', `比較：今天(${temps[i]}) 是否 > Stack 頂端第 ${topIndex} 天(${temps[topIndex]})？`, 7, i, topIndex, stack, answer, resolvedIndices);

                        if (temps[i] > temps[topIndex]) {
                            // 4. Pop & Update
                            const prevIndex = stack.pop();
                            answer[prevIndex] = i - prevIndex;
                            resolvedIndices.push(prevIndex);

                            addStep('POP_UPDATE',
                                `成立！第 ${prevIndex} 天找到更高溫。等待天數 = ${i} - ${prevIndex} = ${i - prevIndex}。從 Stack 彈出。`,
                                10, i, prevIndex, stack, answer, resolvedIndices);
                        } else {
                            addStep('COMPARE_FAIL', `不成立：今天(${temps[i]}) 沒有比 Stack 頂端(${temps[topIndex]}) 暖和。停止比較。`, 7, i, topIndex, stack, answer, resolvedIndices);
                            break;
                        }
                    }

                    // 5. Push
                    stack.push(i);
                    addStep('PUSH', `將第 ${i} 天 (${temps[i]}) 推入 Stack，等待未來更高溫。`, 12, i, null, stack, answer, resolvedIndices);
                }

                addStep('FINISH', '遍歷結束，返回 Answer 陣列。', 14, n, null, stack, answer, resolvedIndices);

                return stepsList;
            }, []);

            // --- 初始化與輸入處理 ---
            useEffect(() => {
                const newSteps = generateSteps(temperatures);
                setSteps(newSteps);
                setCurrentStepIndex(0);
                setIsPlaying(false);
            }, [temperatures, generateSteps]);

            const handleInputChange = (e) => {
                setInputStr(e.target.value);
            };

            const applyInput = () => {
                try {
                    const arr = inputStr.split(',').map(s => {
                        const num = parseInt(s.trim(), 10);
                        if (isNaN(num)) throw new Error("無效的數字");
                        return num;
                    });
                    if (arr.length === 0) throw new Error("陣列不能為空");
                    setTemperatures(arr);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg('輸入格式錯誤，請用逗號分隔數字 (例如: 73, 74, 75)');
                }
            };

            const loadExample = (data) => {
                setInputStr(data.join(','));
                setTemperatures(data);
                setErrorMsg('');
            };

            // --- 播放控制 ---
            useEffect(() => {
                if (isPlaying) {
                    timerRef.current = window.setInterval(() => {
                        setCurrentStepIndex(prev => {
                            if (prev >= steps.length - 1) {
                                setIsPlaying(false);
                                return prev;
                            }
                            return prev + 1;
                        });
                    }, speed);
                } else {
                    if (timerRef.current !== null) clearInterval(timerRef.current);
                }
                return () => {
                    if (timerRef.current !== null) clearInterval(timerRef.current);
                };
            }, [isPlaying, steps.length, speed]);

            const handleNext = () => {
                setIsPlaying(false);
                setCurrentStepIndex(prev => Math.min(prev + 1, steps.length - 1));
            };

            const handlePrev = () => {
                setIsPlaying(false);
                setCurrentStepIndex(prev => Math.max(prev - 1, 0));
            };

            const handleReset = () => {
                setIsPlaying(false);
                setCurrentStepIndex(0);
            };

            // --- 當前狀態 ---
            const currentStep = steps[currentStepIndex] || {
                temperatures: [], stack: [], answer: [], currentIndex: -1, comparingIndex: null, description: '', highlightLine: -1, resolvedIndices: []
            };

            // --- Helper for Visualization Styles ---
            const getBarColor = (index) => {
                if (index === currentStep.comparingIndex) return 'bg-red-500 border-red-700'; // 正在比較
                if (index === currentStep.currentIndex && currentStepIndex < steps.length -1) return 'bg-orange-500 border-orange-700'; // 當前 i
                if (currentStep.stack.includes(index)) return 'bg-purple-500 border-purple-700'; // 在 Stack 中
                if (currentStep.resolvedIndices.includes(index)) return 'bg-emerald-500 border-emerald-700'; // 已解決

                return 'bg-blue-400 border-blue-600'; // 預設
            };

            const maxTemp = Math.max(...temperatures, 100);

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
                    <header className="mb-6 border-b pb-4 border-slate-200">
                        <h1 className="text-3xl font-bold text-slate-900 mb-2">每日溫度 (Monotonic Stack) 視覺化</h1>
                        <p className="text-slate-600">LeetCode 739: 給定每日溫度，回傳還需要等幾天才會出現更高溫。</p>
                    </header>

                    {/* Input Section */}
                    <section className="mb-8 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex flex-col md:flex-row gap-4 items-end md:items-center">
                            <div className="flex-1 w-full">
                                <label className="block text-sm font-medium text-slate-700 mb-1">自定義溫度陣列 (逗號分隔)</label>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={inputStr}
                                        onChange={handleInputChange}
                                        className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono"
                                        placeholder="例如: 73, 74, 75, 71..."
                                    />
                                    <button onClick={applyInput} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">
                                        應用
                                    </button>
                                </div>
                                {errorMsg && <p className="text-red-500 text-sm mt-1">{errorMsg}</p>}
                            </div>

                            <div className="flex flex-wrap gap-2">
                                {EXAMPLES.map((ex, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => loadExample(ex.data)}
                                        className="px-3 py-1 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition-colors"
                                    >
                                        {ex.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Main Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                        {/* Left Column: Visualization */}
                        <div className="lg:col-span-7 flex flex-col gap-6">

                            {/* Chart Area */}
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 min-h-[300px] relative">
                                <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                    <span className="w-2 h-6 bg-blue-500 rounded-sm"></span>
                                    溫度陣列視覺化
                                </h3>

                                <div className="flex items-end justify-center gap-1 md:gap-3 h-64 border-b border-slate-200 pb-2 overflow-x-auto">
                                    {temperatures.map((temp, idx) => {
                                        const heightPercent = Math.max((temp / maxTemp) * 100, 10);
                                        return (
                                            <div key={idx} className="flex flex-col items-center group relative min-w-[30px] md:min-w-[40px]">
                                                {/* Value on top */}
                                                <span className="text-xs font-bold mb-1 text-slate-500 transition-all">{temp}</span>

                                                {/* Bar */}
                                                <div
                                                    className={`w-full rounded-t-md border-b-0 border-2 transition-all duration-300 ${getBarColor(idx)}`}
                                                    style={{ height: `${heightPercent}%` }}
                                                ></div>

                                                {/* Index */}
                                                <span className={`text-xs mt-2 font-mono ${currentStep.currentIndex === idx ? 'font-bold text-orange-600 scale-125' : 'text-slate-400'} transition-all`}>
                                                    {idx}
                                                </span>

                                                {/* Arrow Pointer for Current I */}
                                                {currentStep.currentIndex === idx && (
                                                    <div className="absolute -bottom-8 text-orange-500 animate-bounce">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                                            <path d="M12 19V5" />
                                                            <path d="M5 12l7-7 7 7" />
                                                        </svg>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Legend */}
                                <div className="flex flex-wrap gap-4 mt-8 justify-center text-xs text-slate-600">
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 bg-orange-500 rounded"></span> 當前指標 (i)</div>
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 bg-purple-500 rounded"></span> Stack 中</div>
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 bg-red-500 rounded"></span> 正在比較 (Top)</div>
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 bg-emerald-500 rounded"></span> 已解決 (Answered)</div>
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 bg-blue-400 rounded"></span> 未處理/等待</div>
                                </div>
                            </div>

                            {/* Stack & Answer Area */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                                {/* Stack View */}
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-semibold mb-4 text-purple-700 flex items-center gap-2">
                                        <div className="p-1 bg-purple-100 rounded">
                                            <svg className="w-4 h-4 text-purple-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                                        </div>
                                        Monotonic Stack
                                    </h3>
                                    <div className="border-2 border-slate-300 border-t-0 rounded-b-lg h-48 flex flex-col-reverse justify-start p-2 bg-slate-50 items-center overflow-y-auto w-32 mx-auto relative">
                                        <span className="absolute -right-24 bottom-2 text-xs text-slate-400 rotate-90 origin-left">Stack Bottom</span>
                                        {currentStep.stack.length === 0 ? (
                                            <span className="text-slate-400 text-sm mt-4">Empty</span>
                                        ) : (
                                            currentStep.stack.map((idxInStack, i) => (
                                                <div
                                                    key={`${idxInStack}-${i}`}
                                                    className={`w-24 p-2 text-center text-sm font-mono border mb-1 rounded transition-all duration-300 shadow-sm
                                                    ${idxInStack === currentStep.comparingIndex ? 'bg-red-100 border-red-500 text-red-700 scale-105 font-bold' : 'bg-purple-100 border-purple-300 text-purple-900'}
                                                    `}
                                                >
                                                    Index: {idxInStack}<br/>
                                                    <span className="text-xs opacity-70">Val: {temperatures[idxInStack]}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <p className="text-xs text-center mt-2 text-slate-500">儲存等待更高溫的「索引」</p>
                                </div>

                                {/* Answer Array View */}
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-semibold mb-4 text-emerald-700 flex items-center gap-2">
                                        <div className="p-1 bg-emerald-100 rounded">
                                            <svg className="w-4 h-4 text-emerald-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        </div>
                                        Answer Array
                                    </h3>
                                    <div className="grid grid-cols-4 sm:grid-cols-6 gap-2">
                                        {currentStep.answer.map((ans, idx) => (
                                            <div key={idx} className="flex flex-col items-center">
                                                <div className={`
                                                    w-full aspect-square flex items-center justify-center font-bold text-lg rounded border transition-colors duration-500
                                                    ${currentStep.resolvedIndices.includes(idx) ? 'bg-emerald-100 border-emerald-400 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-300'}
                                                `}>
                                                    {ans}
                                                </div>
                                                <span className="text-[10px] text-slate-400 mt-1">{idx}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                        </div>

                        {/* Right Column: Code & Controls */}
                        <div className="lg:col-span-5 flex flex-col gap-6">

                            {/* Controls */}
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky top-4 z-10">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-semibold text-slate-700">控制面板</h3>
                                    <span className="text-xs font-mono bg-slate-100 px-2 py-1 rounded">Step: {currentStepIndex + 1} / {steps.length}</span>
                                </div>

                                <div className="flex items-center justify-center gap-2 mb-4">
                                    <button onClick={handleReset} className="p-2 rounded-full hover:bg-slate-100 text-slate-600" title="重置"><RotateCcw size={20}/></button>
                                    <button onClick={handlePrev} disabled={currentStepIndex === 0} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 disabled:opacity-30"><SkipBack size={24}/></button>

                                    <button
                                        onClick={() => setIsPlaying(!isPlaying)}
                                        className={`p-4 rounded-full text-white shadow-lg transition-transform active:scale-95 ${isPlaying ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {isPlaying ? <Pause fill="currentColor" /> : <Play fill="currentColor" className="ml-1" />}
                                    </button>

                                    <button onClick={handleNext} disabled={currentStepIndex === steps.length - 1} className="p-2 rounded-full hover:bg-slate-100 text-slate-600 disabled:opacity-30"><SkipForward size={24}/></button>
                                </div>

                                <div className="flex items-center gap-4 px-2">
                                    <span className="text-xs text-slate-500">速度</span>
                                    <input
                                        type="range"
                                        min="100"
                                        max="2000"
                                        step="100"
                                        value={2100 - speed}
                                        onChange={(e) => setSpeed(2100 - parseInt(e.target.value))}
                                        className="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                    />
                                    <span className="text-xs text-slate-500 w-12 text-right">{(2100 - speed)/1000}x</span>
                                </div>
                            </div>

                            {/* Explanation Box */}
                            <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl shadow-sm min-h-[100px] flex items-start gap-3 transition-all duration-300">
                                <Info className="text-amber-500 flex-shrink-0 mt-1" size={20} />
                                <div>
                                    <h4 className="font-bold text-amber-800 text-sm mb-1 uppercase tracking-wide">當前動作</h4>
                                    <p className="text-amber-900 leading-relaxed">
                                        {currentStep.description}
                                    </p>
                                </div>
                            </div>

                            {/* Code Block */}
                            <div className="bg-slate-900 rounded-xl overflow-hidden shadow-lg flex-1 font-mono text-sm relative">
                                <div className="bg-slate-800 px-4 py-2 text-slate-400 text-xs flex justify-between">
                                    <span>Solution.cpp</span>
                                    <span>C++</span>
                                </div>
                                <div className="p-4 overflow-x-auto">
                                    <pre className="text-slate-300 leading-6">
                                        {CPP_CODE.split('\n').map((line, idx) => {
                                            const lineNum = idx + 1;
                                            const isHighlighted = currentStep.highlightLine === lineNum;
                                            return (
                                                <div
                                                    key={idx}
                                                    className={`
                                                        flex transition-colors duration-200 rounded px-2 -mx-2
                                                        ${isHighlighted ? 'bg-blue-500/30 text-white font-bold' : ''}
                                                    `}
                                                >
                                                    <span className="w-8 inline-block text-slate-600 select-none text-right mr-4">{lineNum}</span>
                                                    <span>{line}</span>
                                                    {isHighlighted && (
                                                        <span className="ml-auto text-blue-200 hidden md:inline-block">
                                                            <ChevronRight size={16}/>
                                                        </span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </pre>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DailyTemperaturesViz />);
    </script>
</body>
</html>
