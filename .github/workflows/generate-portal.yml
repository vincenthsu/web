name: Generate Project Portal
on:
  push:
    branches:
      - gh-pages

# 設定權限讓 Action 可以寫入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Index HTML
        run: |
          # 這裡是一段 Python 腳本，直接嵌入在 Action 裡執行
          python -c "
          import os
          import re

          # 設定要略過的資料夾 (例如 .git 或 node_modules)
          IGNORE_DIRS = {'.git', '.github', 'node_modules', '_site'}

          html_content = '''
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset='utf-8'>
              <title>我的專案列表</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
                  h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
                  .project-list { list-style: none; padding: 0; }
                  .project-item { margin: 15px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; transition: 0.2s; }
                  .project-item:hover { background-color: #f9f9f9; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
                  .project-title { font-size: 1.2em; font-weight: bold; }
                  .project-link { text-decoration: none; color: #0366d6; display: block; }
                  .project-path { color: #666; font-size: 0.9em; margin-top: 5px; }
              </style>
          </head>
          <body>
              <h1>🚀 我的專案入口</h1>
              <ul class='project-list'>
          '''

          projects = []

          # 掃描當前目錄
          for root, dirs, files in os.walk('.'):
              # 移除要忽略的資料夾，避免掃描
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS]

              if 'index.html' in files and root != '.':
                  path = os.path.relpath(root, '.')
                  index_path = os.path.join(root, 'index.html')

                  # 嘗試讀取該網頁的 <title>
                  title = path  # 預設標題為資料夾名稱
                  try:
                      with open(index_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                          match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                          if match:
                              title = match.group(1)
                  except:
                      pass

                  projects.append({'path': path, 'title': title})

          # 根據路徑排序
          projects.sort(key=lambda x: x['path'])

          for p in projects:
              html_content += f'''
              <li class='project-item'>
                  <a class='project-link' href='{p['path']}/'>
                      <div class='project-title'>{p['title']}</div>
                      <div class='project-path'>📂 {p['path']}</div>
                  </a>
              </li>
              '''

          html_content += '''
              </ul>
              <footer style='margin-top: 50px; color: #888; font-size: 0.8em;'>
                  Last updated via GitHub Actions
              </footer>
          </body>
          </html>
          '''

          # 輸出檔案
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)

          print('✅ Successfully generated index.html with project list!')
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4