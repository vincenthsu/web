<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直方圖最大矩形視覺化 (Monotonic Stack)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel (用於在瀏覽器中編譯 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 避免在加載時出現閃爍 */
        body {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 定義內嵌 SVG 圖示組件
        const Icons = {
            Play: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            ),
            Pause: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
            ),
            SkipForward: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polygon points="5 4 15 12 5 20 5 4"></polygon>
                    <line x1="19" y1="5" x2="19" y2="19"></line>
                </svg>
            ),
            SkipBack: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polygon points="19 20 9 12 19 4 19 20"></polygon>
                    <line x1="5" y1="19" x2="5" y2="5"></line>
                </svg>
            ),
            RotateCcw: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M1 4v6h6"></path>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
            ),
            Info: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            )
        };

        // C++ 程式碼字串
        const CPP_CODE = `int largestRectangleArea(vector<int>& heights) {
    stack<int> st;
    int maxArea = 0;
    int n = heights.size();

    for (int i = 0; i <= n; i++) {
        int h = (i == n) ? 0 : heights[i];

        while (!st.empty() && h < heights[st.top()]) {
            int height = heights[st.top()];
            st.pop();
            int width = st.empty() ? i : i - st.top() - 1;
            maxArea = max(maxArea, height * width);
        }
        st.push(i);
    }
    return maxArea;
}`;

        // 修正後的對應程式碼行號映射 (0-indexed, 包含空行)
        // 0: int largestRectangleArea...
        // 1: stack<int> st;
        // 2: int maxArea = 0;
        // 3: int n = heights.size();
        // 4: (empty)
        // 5: for (int i = 0; i <= n; i++) {
        // 6:     int h = (i == n) ? 0 : heights[i];
        // 7:     (empty)
        // 8:     while (!st.empty() && h < heights[st.top()]) {
        // 9:         int height = heights[st.top()];
        // 10:        st.pop();
        // 11:        int width = st.empty() ? i : i - st.top() - 1;
        // 12:        maxArea = max(maxArea, height * width);
        // 13:    }
        // 14:    st.push(i);
        // 15: }
        // 16: return maxArea;
        const LINE_MAPPING = {
            INIT: 1,
            LOOP: 5,
            SET_H: 6,
            WHILE_CHECK: 8,
            GET_HEIGHT: 9,
            POP: 10,
            CALC_WIDTH: 11,
            UPDATE_MAX: 12,
            PUSH: 14,
            RETURN: 16
        };

        const LargestRectangleHistogram = () => {
            // 狀態管理
            const [inputStr, setInputStr] = useState("2,1,5,6,2,3");
            const [heights, setHeights] = useState([2, 1, 5, 6, 2, 3]);
            const [currentStep, setCurrentStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(1000);
            const [errorMsg, setErrorMsg] = useState("");

            // 產生演算法步驟
            const steps = useMemo(() => {
                const stepsLog = [];
                const st = []; // 存索引
                const n = heights.length;
                let maxArea = 0;
                let maxAreaRect = null; // {x, y, w, h}

                // 初始狀態
                stepsLog.push({
                    type: 'INIT',
                    stack: [],
                    i: -1,
                    currentHeight: null,
                    poppedIndex: null,
                    calcRect: null,
                    maxArea: 0,
                    maxAreaRect: null,
                    message: "演算法開始，初始化堆疊與變數。",
                    codeLine: LINE_MAPPING.INIT
                });

                // 模擬迴圈執行至 n (包含最後處理剩餘堆疊的虛擬步驟)
                for (let i = 0; i <= n; i++) {
                    const h = (i === n) ? 0 : heights[i];

                    stepsLog.push({
                        type: 'LOOP',
                        stack: [...st],
                        i: i,
                        currentHeight: h,
                        poppedIndex: null,
                        calcRect: null,
                        maxArea: maxArea,
                        maxAreaRect: maxAreaRect,
                        message: i === n ? "到達陣列末端，準備清空堆疊 (h=0)" : `迭代索引 i = ${i}, 高度 = ${h}`,
                        codeLine: LINE_MAPPING.LOOP
                    });

                    // While loop logic
                    while (st.length > 0 && h < heights[st[st.length - 1]]) {
                        const topIndex = st[st.length - 1];

                        stepsLog.push({
                            type: 'WHILE_CHECK',
                            stack: [...st],
                            i: i,
                            currentHeight: h,
                            poppedIndex: null, // 還沒 pop
                            highlightStackTop: true,
                            calcRect: null,
                            maxArea: maxArea,
                            maxAreaRect: maxAreaRect,
                            message: `檢查: 當前高度 ${h} < 堆疊頂端高度 ${heights[topIndex]}，需要計算面積。`,
                            codeLine: LINE_MAPPING.WHILE_CHECK
                        });

                        const height = heights[st.pop()];

                        stepsLog.push({
                            type: 'POP',
                            stack: [...st],
                            i: i,
                            currentHeight: h,
                            poppedIndex: topIndex,
                            calcRect: null,
                            maxArea: maxArea,
                            maxAreaRect: maxAreaRect,
                            message: `彈出堆疊頂端索引 ${topIndex} (高度: ${height}) 作為計算高度。`,
                            codeLine: LINE_MAPPING.POP
                        });

                        const width = st.length === 0 ? i : i - st[st.length - 1] - 1;
                        const area = height * width;

                        // 計算矩形的視覺化參數
                        // 左邊界是 st.top() + 1 (如果空則是 0)，右邊界是 i - 1
                        const leftBound = st.length === 0 ? 0 : st[st.length - 1] + 1;
                        const currentRect = { x: leftBound, w: width, h: height, area: area };

                        if (area > maxArea) {
                            maxArea = area;
                            maxAreaRect = currentRect;
                        }

                        stepsLog.push({
                            type: 'CALC',
                            stack: [...st],
                            i: i,
                            currentHeight: h,
                            poppedIndex: topIndex,
                            calcRect: currentRect,
                            maxArea: maxArea,
                            maxAreaRect: maxAreaRect,
                            message: `計算面積: 高度 ${height} * 寬度 ${width} = ${area}。更新最大面積。`,
                            codeLine: LINE_MAPPING.UPDATE_MAX
                        });
                    }

                    // Push step
                    st.push(i);
                    stepsLog.push({
                        type: 'PUSH',
                        stack: [...st],
                        i: i,
                        currentHeight: h,
                        poppedIndex: null,
                        calcRect: null,
                        maxArea: maxArea,
                        maxAreaRect: maxAreaRect,
                        message: `將索引 ${i} 推入堆疊。`,
                        codeLine: LINE_MAPPING.PUSH
                    });
                }

                stepsLog.push({
                    type: 'FINISH',
                    stack: [...st],
                    i: n,
                    currentHeight: 0,
                    poppedIndex: null,
                    calcRect: null,
                    maxArea: maxArea,
                    maxAreaRect: maxAreaRect,
                    message: `演算法結束，最大矩形面積為 ${maxArea}。`,
                    codeLine: LINE_MAPPING.RETURN
                });

                return stepsLog;
            }, [heights]);

            // Timer for auto-play
            useEffect(() => {
                let interval;
                if (isPlaying && currentStep < steps.length - 1) {
                    interval = setInterval(() => {
                        setCurrentStep(prev => prev + 1);
                    }, speed);
                } else {
                    setIsPlaying(false);
                }
                return () => clearInterval(interval);
            }, [isPlaying, currentStep, steps.length, speed]);

            // Handlers
            const handleNext = () => {
                if (currentStep < steps.length - 1) setCurrentStep(prev => prev + 1);
            };

            const handlePrev = () => {
                if (currentStep > 0) setCurrentStep(prev => prev - 1);
            };

            const handleReset = () => {
                setIsPlaying(false);
                setCurrentStep(0);
            };

            const handleLoadData = () => {
                try {
                    const arr = inputStr.split(',').map(s => {
                        const n = parseInt(s.trim());
                        if (isNaN(n) || n < 0) throw new Error("無效數字");
                        return n;
                    });
                    if (arr.length === 0) throw new Error("陣列不可為空");
                    if (arr.length > 20) throw new Error("建議輸入 20 個以內的數字以利觀察");

                    setHeights(arr);
                    setCurrentStep(0);
                    setIsPlaying(false);
                    setErrorMsg("");
                } catch (e) {
                    setErrorMsg("輸入格式錯誤：請輸入逗號分隔的正整數 (例如: 2,1,5,6,2,3)");
                }
            };

            // Visualization Constants
            const maxBarHeight = Math.max(...heights, 1);
            const stepData = steps[currentStep];

            return (
                <div className="flex flex-col w-full h-screen bg-gray-50 text-gray-800 font-sans overflow-hidden">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 p-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                        <h1 className="text-xl font-bold text-blue-700 flex items-center gap-2">
                            <div className="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white">
                                <Icons.Play size={16} className="text-white" />
                            </div>
                            直方圖最大矩形視覺化 (Monotonic Stack)
                        </h1>

                        <div className="flex items-center gap-2 bg-gray-100 p-2 rounded-lg">
                            <span className="text-sm font-medium text-gray-600">Input:</span>
                            <input
                                type="text"
                                value={inputStr}
                                onChange={(e) => setInputStr(e.target.value)}
                                className="border border-gray-300 rounded px-2 py-1 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="e.g. 2,1,5,6,2,3"
                            />
                            <button
                                onClick={handleLoadData}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm transition-colors"
                            >
                                載入
                            </button>
                        </div>
                    </header>

                    {errorMsg && (
                        <div className="bg-red-100 text-red-700 px-4 py-2 text-sm text-center border-b border-red-200">
                            {errorMsg}
                        </div>
                    )}

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col lg:flex-row overflow-hidden">

                        {/* Left: Visualization */}
                        <div className="flex-1 p-6 flex flex-col border-r border-gray-200 bg-white relative overflow-y-auto">

                            {/* Status Bar */}
                            <div className="flex justify-between items-center mb-6 bg-gray-50 p-3 rounded border border-gray-200">
                                <div>
                                    <span className="font-bold text-gray-700">步驟: </span>
                                    <span className="font-mono text-blue-600">{currentStep + 1} / {steps.length}</span>
                                </div>
                                <div>
                                    <span className="font-bold text-gray-700">當前最大面積: </span>
                                    <span className="font-mono text-green-600 text-lg font-bold">
                                        {stepData.maxArea}
                                    </span>
                                </div>
                            </div>

                            {/* Histogram Container */}
                            <div className="flex-1 flex items-end justify-start gap-1 min-h-[300px] relative border-b-2 border-gray-300 pb-1 px-4 overflow-x-auto">

                                {/* Bars */}
                                {heights.map((h, idx) => {
                                    const isPopped = stepData.poppedIndex === idx;
                                    const isInStack = stepData.stack.includes(idx);
                                    const isCurrentI = stepData.i === idx;

                                    // Color logic
                                    let bgColor = "bg-blue-300"; // Default
                                    if (isPopped) bgColor = "bg-red-400";
                                    else if (isInStack) bgColor = "bg-orange-300";

                                    // Opacity logic (dim if we are calculating past it, emphasize active)
                                    let opacity = "opacity-100";

                                    return (
                                        <div key={idx} className="flex flex-col items-center justify-end group w-12 flex-shrink-0 relative">
                                            {/* Value Label */}
                                            <span className="text-xs font-medium text-gray-500 mb-1">{h}</span>

                                            {/* The Bar */}
                                            <div
                                                className={`w-full transition-all duration-300 rounded-t-sm ${bgColor} ${opacity} border border-white/50`}
                                                style={{ height: `${(h / maxBarHeight) * 250}px` }}
                                            ></div>

                                            {/* Index Label */}
                                            <div className={`mt-2 text-xs font-mono w-6 h-6 flex items-center justify-center rounded-full ${isCurrentI ? 'bg-black text-white' : 'text-gray-400'}`}>
                                                {idx}
                                            </div>

                                            {/* 'i' pointer */}
                                            {isCurrentI && (
                                                <div className="absolute -bottom-8 flex flex-col items-center text-black animate-bounce">
                                                    <span className="text-xs font-bold">i</span>
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}

                                {/* Current Calculation Rectangle Overlay */}
                                {stepData.calcRect && (
                                    <div
                                        className="absolute bottom-9 border-2 border-red-600 bg-red-500/30 flex items-center justify-center z-10 transition-all duration-300"
                                        style={{
                                            left: `calc(1rem + ${stepData.calcRect.x * 52}px)`, // 48px width + 4px gap = 52px approx per unit. Simplified for demo
                                            width: `${stepData.calcRect.w * 52 - 4}px`, // Adjust for gap
                                            height: `${(stepData.calcRect.h / maxBarHeight) * 250}px`
                                        }}
                                    >
                                        <span className="text-white font-bold drop-shadow-md text-lg">
                                            {stepData.calcRect.area}
                                        </span>
                                    </div>
                                )}

                                {/* Global Max Rectangle Overlay (Green - Optional/Behind) */}
                                {stepData.maxAreaRect && !stepData.calcRect && (
                                     <div
                                     className="absolute bottom-9 border-2 border-dashed border-green-600 bg-green-500/10 z-0 transition-all duration-500 pointer-events-none"
                                     style={{
                                         left: `calc(1rem + ${stepData.maxAreaRect.x * 52}px)`,
                                         width: `${stepData.maxAreaRect.w * 52 - 4}px`,
                                         height: `${(stepData.maxAreaRect.h / maxBarHeight) * 250}px`
                                     }}
                                 />
                                )}
                            </div>

                            {/* Message Box */}
                            <div className="mt-8 p-4 bg-blue-50 border-l-4 border-blue-500 rounded text-gray-700 min-h-[80px] flex items-start gap-3">
                                <Icons.Info className="w-5 h-5 text-blue-600 mt-1 flex-shrink-0" />
                                <div>
                                    <p className="font-semibold text-blue-800">當前操作:</p>
                                    <p>{stepData.message}</p>
                                </div>
                            </div>

                            {/* Legend */}
                            <div className="mt-4 flex flex-wrap gap-4 text-xs text-gray-500">
                                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-blue-300 rounded"></div> 未處理/一般</div>
                                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-orange-300 rounded"></div> 在堆疊中</div>
                                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-red-400 rounded"></div> 正在彈出/計算高度</div>
                                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-red-500/30 border border-red-500"></div> 當前計算矩形</div>
                                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-green-500/10 border border-green-600 border-dashed"></div> 已知最大矩形</div>
                            </div>
                        </div>

                        {/* Right: Logic & Controls */}
                        <div className="lg:w-[32rem] flex flex-col border-t lg:border-t-0 lg:border-l border-gray-200 bg-gray-50">

                            {/* Controls */}
                            <div className="p-4 bg-white border-b border-gray-200 grid grid-cols-2 gap-2">
                                 <div className="col-span-2 flex justify-center gap-2 mb-2">
                                    <button onClick={handleReset} className="p-2 text-gray-600 hover:bg-gray-100 rounded-full" title="重置">
                                        <Icons.RotateCcw size={20} />
                                    </button>
                                    <button onClick={handlePrev} disabled={currentStep === 0} className="p-2 text-gray-600 hover:bg-gray-100 rounded-full disabled:opacity-30" title="上一步">
                                        <Icons.SkipBack size={20} />
                                    </button>
                                    <button
                                        onClick={() => setIsPlaying(!isPlaying)}
                                        className={`p-2 rounded-full text-white shadow-md transition-transform active:scale-95 ${isPlaying ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}`}
                                        title={isPlaying ? "暫停" : "播放"}
                                    >
                                        {isPlaying ? <Icons.Pause size={24} /> : <Icons.Play size={24} />}
                                    </button>
                                    <button onClick={handleNext} disabled={currentStep === steps.length - 1} className="p-2 text-gray-600 hover:bg-gray-100 rounded-full disabled:opacity-30" title="下一步">
                                        <Icons.SkipForward size={20} />
                                    </button>
                                </div>

                                <div className="col-span-2 flex items-center gap-2 px-2">
                                    <span className="text-xs text-gray-500">速度:</span>
                                    <input
                                        type="range"
                                        min="100"
                                        max="2000"
                                        step="100"
                                        value={speed}
                                        onChange={(e) => setSpeed(Number(e.target.value))}
                                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                    />
                                    <span className="text-xs font-mono w-10 text-right">{speed}ms</span>
                                </div>
                            </div>

                            {/* Stack Visualization */}
                            <div className="p-4 border-b border-gray-200 bg-white">
                                <h3 className="text-sm font-bold text-gray-700 mb-2">堆疊狀態 (Indices)</h3>
                                <div className="min-h-[60px] p-2 bg-gray-100 rounded border border-gray-300 flex items-center overflow-x-auto gap-2">
                                    <span className="text-xs text-gray-400 italic mr-2">Bottom</span>
                                    {stepData.stack.map((idx, i) => (
                                        <div key={`${idx}-${i}`} className="bg-orange-100 border border-orange-300 text-orange-800 px-2 py-1 rounded text-sm font-mono shadow-sm whitespace-nowrap">
                                            idx: {idx} <span className="text-xs text-gray-400">({heights[idx]})</span>
                                        </div>
                                    ))}
                                    {stepData.stack.length === 0 && <span className="text-gray-400 text-sm">Empty</span>}
                                    <span className="text-xs text-gray-400 italic ml-auto">Top</span>
                                </div>
                            </div>

                            {/* Code Display */}
                            <div className="flex-1 p-4 overflow-y-auto bg-gray-900 text-gray-300 font-mono text-xs leading-relaxed">
                                <pre className="whitespace-pre-wrap">
                                    {CPP_CODE.split('\n').map((line, i) => (
                                        <div
                                            key={i}
                                            className={`px-2 py-0.5 rounded transition-colors duration-200 ${stepData.codeLine === i ? 'bg-yellow-600/50 text-white font-bold border-l-2 border-yellow-400' : 'hover:bg-gray-800'}`}
                                        >
                                            <span className="inline-block w-6 text-gray-600 select-none text-right mr-2">{i}</span>
                                            {line}
                                        </div>
                                    ))}
                                </pre>
                            </div>

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LargestRectangleHistogram />);
    </script>
</body>
</html>
