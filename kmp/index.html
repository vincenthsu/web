<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字串搜尋演算法視覺化 (Find the Index of the First Occurrence)</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .cell-transition {
            transition: all 0.3s ease-in-out;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons (SVG) ---
        const PlayIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const PauseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        );
        const StepIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        );
        const RefreshIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        );

        // --- Constants & Data ---
        // Careful with lines! Used for highlighting.
        // L1: int strStr...
        // L5: for (int i = 0...
        // L6: int j = 0;
        // L7: for (; j < m; j++) {
        // L8: if (haystack[i + j] != needle[j]) {
        // L9: break;
        // L12: if (j == m) {
        // L13: return i;
        // L16: return -1;
        const CPP_CODE = `int strStr(string haystack, string needle) {
    int n = haystack.length();
    int m = needle.length();

    for (int i = 0; i <= n - m; i++) {
        int j = 0;
        for (; j < m; j++) {
            if (haystack[i + j] != needle[j]) {
                break; // Mismatch
            }
        }
        if (j == m) {
            return i; // Found
        }
    }
    return -1; // Not Found
}`;

        // --- Main Component ---
        const App = () => {
            // Inputs
            const [haystack, setHaystack] = useState("sadbutsad");
            const [needle, setNeedle] = useState("sad");

            // Algorithm State
            const [i, setI] = useState(0);
            const [j, setJ] = useState(0);
            const [currentLine, setCurrentLine] = useState(0);

            // Detailed Status for State Machine
            // IDLE, CHECK_OUTER_BOUNDS, INIT_J, CHECK_INNER_BOUNDS, COMPARE, MATCH_FOUND, BREAK, CHECK_FINAL_J, FINISHED
            const [status, setStatus] = useState("IDLE");
            const [message, setMessage] = useState("準備開始...");
            const [result, setResult] = useState(null);

            // Control State
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(800);

            // Reset execution state
            const resetState = () => {
                setI(0);
                setJ(0);
                setCurrentLine(0);
                setStatus("IDLE");
                setMessage("準備開始...");
                setResult(null);
                setIsPlaying(false);
            };

            const handleRandom = () => {
                const chars = "abcdefg";
                let h = "";
                let n = "";
                for(let k=0; k<12; k++) h += chars[Math.floor(Math.random() * chars.length)];
                for(let k=0; k<3; k++) n += chars[Math.floor(Math.random() * chars.length)];
                setHaystack(h);
                setNeedle(n);
                resetState();
            };

            const handlePreset1 = () => {
                setHaystack("sadbutsad");
                setNeedle("sad");
                resetState();
            };
            const handlePreset2 = () => {
                setHaystack("leetcode");
                setNeedle("leeto");
                resetState();
            };

            // Core Algorithm Logic Steps (Revised for strict C++ mapping)
            const nextStep = useCallback(() => {
                if (result !== null) {
                    setIsPlaying(false);
                    return;
                }

                if (needle === "") {
                    setResult(0);
                    setMessage("Needle 為空，返回索引 0");
                    setStatus("FINISHED");
                    return;
                }

                setStatus(prevStatus => {
                    const n = haystack.length;
                    const m = needle.length;

                    // 1. Start / Idle
                    if (prevStatus === "IDLE") {
                        setCurrentLine(5);
                        setMessage(`i = 0，開始外層迴圈`);
                        return "CHECK_OUTER_BOUNDS";
                    }

                    // 2. Outer Loop Condition
                    if (prevStatus === "CHECK_OUTER_BOUNDS") {
                        if (i <= n - m) {
                            setCurrentLine(6);
                            setJ(0); // Actually init J here logically
                            setMessage(`檢查: i (${i}) <= n-m (${n-m})。進入迴圈，初始化 j = 0`);
                            return "INIT_J";
                        } else {
                            setCurrentLine(16);
                            setMessage(`i (${i}) > n-m (${n-m})，搜尋結束。返回 -1`);
                            setResult(-1);
                            return "FINISHED";
                        }
                    }

                    // 3. Init J (Visual Step)
                    if (prevStatus === "INIT_J") {
                        setJ(0);
                        setCurrentLine(7);
                        setMessage(`準備進入內層迴圈: 檢查 j < m`);
                        return "CHECK_INNER_BOUNDS";
                    }

                    // 4. Inner Loop Condition
                    if (prevStatus === "CHECK_INNER_BOUNDS") {
                        if (j < m) {
                            setCurrentLine(8); // Point to 'if'
                            setMessage(`比較: haystack[${i}+${j}] ('${haystack[i+j]}') vs needle[${j}] ('${needle[j]}')`);
                            return "COMPARE";
                        } else {
                            // Loop finished naturally
                            setCurrentLine(12); // Point to 'if (j == m)'
                            setMessage(`內層迴圈結束 (j=${j})。檢查是否完全匹配。`);
                            return "CHECK_FINAL_J";
                        }
                    }

                    // 5. Comparison Logic
                    if (prevStatus === "COMPARE") {
                        if (haystack[i + j] === needle[j]) {
                            // Match!
                            // Stay on line 8 visual for a moment to show Green?
                            // Or move to next step. Let's add a "MATCH_FOUND" state to show green before moving to increment.
                            setMessage(`匹配成功！ '${haystack[i+j]}' == '${needle[j]}'`);
                            return "MATCH_FOUND";
                        } else {
                            // Mismatch!
                            setCurrentLine(9); // Point to 'break'
                            setMessage(`不匹配！ '${haystack[i+j]}' != '${needle[j]}'。準備 Break。`);
                            return "BREAK";
                        }
                    }

                    // 6. Match Found Action (Transition to increment)
                    if (prevStatus === "MATCH_FOUND") {
                        setJ(j + 1);
                        setCurrentLine(7); // Point back to loop header (j++)
                        setMessage(`j 增加為 ${j + 1}，檢查迴圈條件`);
                        return "CHECK_INNER_BOUNDS";
                    }

                    // 7. Break Action
                    if (prevStatus === "BREAK") {
                        // Break jumps out of inner loop to the code following it
                        setCurrentLine(12); // Point to 'if (j == m)'
                        setMessage(`跳出內層迴圈。檢查 j (${j}) 是否等於 m (${m})`);
                        return "CHECK_FINAL_J";
                    }

                    // 8. Check Full Match (after loop end or break)
                    if (prevStatus === "CHECK_FINAL_J") {
                        if (j === m) {
                            setCurrentLine(13); // Point to 'return i'
                            setMessage(`完全匹配！ j == m，返回索引 ${i}`);
                            setResult(i);
                            return "FINISHED";
                        } else {
                            setI(i + 1);
                            setCurrentLine(5); // Point back to outer loop (i++)
                            setMessage(`未完全匹配 (j != m)。i 增加為 ${i + 1}，繼續搜尋`);
                            return "CHECK_OUTER_BOUNDS";
                        }
                    }

                    return prevStatus;
                });
            }, [haystack, needle, i, j, result, status]);


            // Auto-play Effect
            useEffect(() => {
                if (isPlaying && result === null && status !== "FINISHED") {
                    const timer = setTimeout(() => {
                        nextStep();
                    }, speed);
                    return () => clearTimeout(timer);
                } else if (result !== null) {
                    setIsPlaying(false);
                }
            }, [isPlaying, result, nextStep, speed, status]);

            // --- Visualization Logic ---
            const getHaystackCellColor = (idx) => {
                // If finished found
                if (status === "FINISHED" && result !== -1 && idx >= result && idx < result + needle.length) {
                    return "bg-green-500 text-white border-green-600 shadow-md transform scale-105";
                }

                // Only style relevant window
                if (idx >= i && idx < i + needle.length) {
                    const offset = idx - i;

                    // Logic based on precise steps
                    if (status === "COMPARE") {
                        if (offset === j) return "bg-yellow-300 border-yellow-500 scale-110 shadow-lg z-10 font-bold";
                        if (offset < j) return "bg-green-200 border-green-300"; // Matched so far
                    }
                    if (status === "MATCH_FOUND") {
                        if (offset === j) return "bg-green-400 text-white border-green-500 scale-110 shadow-lg z-10"; // Just matched
                        if (offset < j) return "bg-green-200 border-green-300";
                    }
                    if (status === "BREAK") {
                        if (offset === j) return "bg-red-400 text-white border-red-500 scale-110 shadow-lg z-10"; // Mismatch
                        if (offset < j) return "bg-green-200 border-green-300";
                    }
                    // For other states (INIT_J, CHECK_INNER_BOUNDS, CHECK_FINAL_J)
                    // Show current progress
                    if (offset < j) return "bg-green-200 border-green-300";

                    return "bg-blue-50 border-blue-200";
                }

                // Past indices
                if (idx < i) return "bg-gray-100 text-gray-400 border-gray-200";

                return "bg-white border-gray-200";
            };

            const getNeedleCellColor = (idx) => {
                if (status === "FINISHED" && result !== -1) return "bg-green-500 text-white border-green-600";

                if (status === "COMPARE" && idx === j) return "bg-yellow-300 border-yellow-500 scale-110 shadow-lg";
                if (status === "MATCH_FOUND" && idx === j) return "bg-green-400 text-white border-green-500";
                if (status === "BREAK" && idx === j) return "bg-red-400 text-white border-red-500";

                if (idx < j) return "bg-green-200 border-green-300";

                return "bg-white border-gray-200";
            };


            return (
                <div className="min-h-screen flex flex-col items-center p-4 gap-6">
                    <header className="w-full max-w-6xl flex justify-between items-center border-b pb-4 mb-2">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <span className="bg-blue-600 text-white px-2 py-1 rounded text-lg">28</span>
                                Find the Index of the First Occurrence
                            </h1>
                            <p className="text-gray-500 text-sm mt-1">Naive String Matching Visualization</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handlePreset1} className="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">Example 1</button>
                            <button onClick={handlePreset2} className="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">Example 2</button>
                            <button onClick={handleRandom} className="text-xs bg-purple-100 text-purple-700 hover:bg-purple-200 px-3 py-1 rounded">Random</button>
                        </div>
                    </header>

                    <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* LEFT COLUMN: Visualization & Controls */}
                        <div className="lg:col-span-2 flex flex-col gap-6">

                            {/* Input Panel */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-end">
                                <div className="flex-1 min-w-[150px]">
                                    <label className="block text-xs font-semibold text-gray-500 mb-1 uppercase">Haystack (文本)</label>
                                    <input
                                        type="text"
                                        value={haystack}
                                        onChange={(e) => { setHaystack(e.target.value); resetState(); }}
                                        className="w-full border border-gray-300 rounded px-3 py-2 font-mono text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        disabled={isPlaying}
                                    />
                                </div>
                                <div className="flex-1 min-w-[150px]">
                                    <label className="block text-xs font-semibold text-gray-500 mb-1 uppercase">Needle (目標)</label>
                                    <input
                                        type="text"
                                        value={needle}
                                        onChange={(e) => { setNeedle(e.target.value); resetState(); }}
                                        className="w-full border border-gray-300 rounded px-3 py-2 font-mono text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        disabled={isPlaying}
                                    />
                                </div>
                            </div>

                            {/* Visualization Area */}
                            <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200 min-h-[300px] flex flex-col justify-center items-start overflow-x-auto relative">

                                {/* Haystack Row */}
                                <div className="flex mb-2 ml-14">
                                    {haystack.split('').map((_, idx) => (
                                        <div key={idx} className="w-12 text-center text-xs text-gray-400 font-mono">
                                            {idx}
                                        </div>
                                    ))}
                                </div>
                                <div className="flex items-center mb-8 w-max">
                                    <div className="w-14 text-sm font-bold text-gray-500">Text:</div>
                                    <div className="flex border-2 border-gray-100 rounded-lg p-1 bg-gray-50">
                                        {haystack.split('').map((char, idx) => (
                                            <div
                                                key={idx}
                                                className={`w-12 h-12 flex items-center justify-center border rounded-md m-0.5 text-xl font-bold font-mono cell-transition ${getHaystackCellColor(idx)}`}
                                            >
                                                {char}
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Needle Row (Animated) */}
                                <div className="relative w-full h-20 transition-all duration-500 w-max">
                                    <div
                                        className="absolute top-0 left-0 transition-all duration-500 ease-in-out flex items-center"
                                        style={{ transform: `translateX(${56 + (i * 52)}px)` }}
                                    >
                                        <div className="w-14 -ml-14 text-sm font-bold text-gray-500 absolute top-4">Pat:</div>

                                        <div className="flex p-1 rounded-lg">
                                            {needle.split('').map((char, idx) => (
                                                <div
                                                    key={idx}
                                                    className={`w-12 h-12 flex items-center justify-center border rounded-md m-0.5 text-xl font-bold font-mono shadow-sm cell-transition ${getNeedleCellColor(idx)}`}
                                                >
                                                    {char}
                                                </div>
                                            ))}
                                        </div>

                                        {/* Pointers */}
                                        <div className="absolute -top-6 left-0 flex w-full pointer-events-none">
                                            <div
                                                className="absolute text-blue-600 font-bold text-xs flex flex-col items-center transition-all duration-300"
                                                style={{ left: `${(j * 52) + 24}px` }}
                                            >
                                                <span>j={j}</span>
                                                <span>↓</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Global I pointer (absolute relative to container) */}
                                    <div
                                        className="absolute -top-32 text-purple-600 font-bold text-xs flex flex-col items-center transition-all duration-500 pointer-events-none"
                                        style={{ left: `${56 + (i * 52) + 24}px` }}
                                    >
                                        <span>i={i}</span>
                                        <div className="h-40 border-l-2 border-dashed border-purple-300 opacity-50"></div>
                                    </div>
                                </div>
                            </div>

                            {/* Controls Panel */}
                            <div className="bg-gray-800 text-white p-4 rounded-xl flex items-center justify-between shadow-lg">
                                <div className="flex gap-4">
                                    <button
                                        onClick={() => setIsPlaying(!isPlaying)}
                                        disabled={result !== null}
                                        className={`flex items-center gap-2 px-4 py-2 rounded font-semibold transition ${result !== null ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-700 bg-gray-700'}`}
                                    >
                                        {isPlaying ? <><PauseIcon /> 暫停</> : <><PlayIcon /> 播放</>}
                                    </button>
                                    <button
                                        onClick={nextStep}
                                        disabled={isPlaying || result !== null}
                                        className="flex items-center gap-2 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600 font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        <StepIcon /> 單步
                                    </button>
                                    <button
                                        onClick={resetState}
                                        className="flex items-center gap-2 px-4 py-2 bg-red-600/80 rounded hover:bg-red-600 font-semibold"
                                    >
                                        <RefreshIcon /> 重置
                                    </button>
                                </div>

                                <div className="flex items-center gap-4 w-1/3">
                                    <span className="text-xs text-gray-400">速度:</span>
                                    <input
                                        type="range"
                                        min="100"
                                        max="1500"
                                        step="100"
                                        value={1600 - speed}
                                        onChange={(e) => setSpeed(1600 - parseInt(e.target.value))}
                                        className="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                    />
                                </div>
                            </div>

                            {/* Log Panel */}
                            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-md shadow-sm">
                                <h3 className="text-blue-800 font-bold text-sm mb-1 uppercase tracking-wide">狀態日誌</h3>
                                <p className="text-gray-800 font-medium">{message}</p>
                            </div>

                        </div>

                        {/* RIGHT COLUMN: Code */}
                        <div className="lg:col-span-1 flex flex-col h-full">
                            <div className="bg-gray-900 rounded-xl overflow-hidden shadow-xl flex-1 border border-gray-700 flex flex-col">
                                <div className="bg-gray-800 px-4 py-2 text-xs text-gray-400 border-b border-gray-700 font-mono flex justify-between">
                                    <span>solution.cpp</span>
                                    <span>C++</span>
                                </div>
                                <div className="p-4 overflow-auto flex-1 code-font text-sm leading-6">
                                    {CPP_CODE.split('\n').map((line, idx) => {
                                        const lineNum = idx + 1;
                                        const isHighlighted = lineNum === currentLine;
                                        return (
                                            <div
                                                key={idx}
                                                className={`flex group ${isHighlighted ? 'bg-yellow-900/50 -mx-4 px-4 border-l-2 border-yellow-500' : ''}`}
                                            >
                                                <span className="w-8 text-gray-600 select-none text-right mr-4">{lineNum}</span>
                                                <pre className={`${isHighlighted ? 'text-yellow-100 font-bold' : 'text-gray-300'} m-0`}>
                                                    {line}
                                                </pre>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Legend */}
                            <div className="mt-4 grid grid-cols-2 gap-2 text-xs text-gray-600 bg-white p-3 rounded-lg border">
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-yellow-300 border border-yellow-500 rounded"></div> 正在比較</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-400 border border-green-500 rounded"></div> 匹配成功</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-red-400 border border-red-500 rounded"></div> 匹配失敗</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-200 border border-green-300 rounded"></div> 已匹配部分</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
